<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Edit Employee</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<main class="container py-5">
    <div class="card shadow-sm mx-auto" style="max-width: 720px;">
        <div class="card-header"><h1 class="h5 mb-0">Edit Employee</h1></div>
        <div class="card-body">
            <form th:action="@{/employees/{id}/update(id=${employee.id})}" th:object="${employee}" method="post">
                <div class="row g-3">
                    <div class="col-md-6">
                        <label for="fullName" class="form-label">Full name</label>
                        <input id="fullName" th:field="*{fullName}" class="form-control" th:classappend="${#fields.hasErrors('fullName')} ? ' is-invalid'">
                        <div class="invalid-feedback" th:errors="*{fullName}"></div>
                    </div>
                    <div class="col-md-6">
                        <label for="email" class="form-label">Email</label>
                        <input id="email" type="email" th:field="*{email}" class="form-control"
                        th:classappend="${#fields.hasErrors('email')} ? ' is-invalid'">
                        <div class="invalid-feedback" th:errors="*{email}"></div>
                    </div>
                    <div class="col-md-4">
                        <label for="phone" class="form-label">Phone</label>
                        <input id="phone" th:field="*{phone}" class="form-control"
                               th:classappend="${#fields.hasErrors('phone')} ? ' is-invalid'">
                        <div class="invalid-feedback" th:errors="*{phone}"></div>
                    </div>
                    <div class="col-md-4">
                        <label for="department" class="form-label">Department</label>
                        <input id="department" th:field="*{department}" class="form-control"
                               th:classappend="${#fields.hasErrors('department')} ? ' is-invalid'">
                        <div class="invalid-feedback" th:errors="*{department}"></div>
                    </div>
                    <div class="col-md-4">
                        <label for="salary" class="form-label">Salary</label>
                        <input id="salary" type="number" step="0.01" min="0.01" th:field="*{salary}" class="form-control"
                               th:classappend="${#fields.hasErrors('salary')} ? ' is-invalid'">
                        <div class="invalid-feedback" th:errors="*{salary}"></div>
                    </div>
                </div>
                <div class="mt-3">
                    <button type="submit" class="btn btn-primary">Update employee</button>
                    <a th:href="@{/employees}" class="btn btn-secondary">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</main>
</body>
</html>
