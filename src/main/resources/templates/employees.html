<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Employee Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<main class="container py-5">
    <h1 class="mb-4">Employee Management System</h1>
    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <section class="card shadow-sm mb-4">
        <div class="card-header"><h2 class="h5 mb-0">Add Employee</h2></div>
        <div class="card-body">
            <form th:action="@{/employees}" th:object="${employee}" method="post">
                <div class="row g-3">
                    <div class="col-md-6">
                        <label for="fullName" class="form-label">Full name</label>
                        <input id="fullName" th:field="*{fullName}" class="form-control"
                               th:classappend="${#fields.hasErrors('fullName')} ? ' is-invalid'">
                        <div class="invalid-feedback" th:errors="*{fullName}"></div>
                    </div>
                    <div class="col-md-6">
                        <label for="email" class="form-label">Email</label>
                        <input id="email" type="email" th:field="*{email}" class="form-control"
                               th:classappend="${#fields.hasErrors('email')} ? ' is-invalid'">
                        <div class="invalid-feedback" th:errors="*{email}"></div>
                    </div>
                    <div class="col-md-4">
                        <label for="phone" class="form-label">Phone</label>
                        <input id="phone" th:field="*{phone}" class="form-control"
                               th:classappend="${#fields.hasErrors('phone')} ? ' is-invalid'">
                        <div class="invalid-feedback" th:errors="*{phone}"></div>
                    </div>
                    <div class="col-md-4">
                        <label for="department" class="form-label">Department</label>
                        <input id="department" th:field="*{department}" class="form-control"
                               th:classappend="${#fields.hasErrors('department')} ? ' is-invalid'">
                        <div class="invalid-feedback" th:errors="*{department}"></div>
                    </div>
                    <div class="col-md-4">
                        <label for="salary" class="form-label">Salary</label>
                        <input id="salary" type="number" step="0.01" min="0.01" th:field="*{salary}" class="form-control"
                               th:classappend="${#fields.hasErrors('salary')} ? ' is-invalid'">
                        <div class="invalid-feedback" th:errors="*{salary}"></div>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary mt-3">Save employee</button>
            </form>
        </div>
    </section>

    <section class="card shadow-sm">
        <div class="card-header"><h2 class="h5 mb-0">Employees</h2></div>
        <div class="table-responsive">
            <table class="table table-striped table-hover mb-0">
                <thead><tr><th>ID</th><th>Full name</th><th>Email</th><th>Phone</th>
                    <th>Department</th><th>Salary</th><th>Actions</th></tr></thead>
                <tbody>
                <tr th:if="${#lists.isEmpty(employees)}"><td colspan="7" class="text-center">No employees found.</td></tr>
                <tr th:each="employee : ${employees}">
                    <td th:text="${employee.id}"></td>
                    <td th:text="${employee.fullName}"></td>
                    <td th:text="${employee.email}"></td>
                    <td th:text="${employee.phone}"></td>
                    <td th:text="${employee.department}"></td>
                    <td th:text="${employee.salary}"></td>
                    <td class="text-nowrap">
                        <a class="btn btn-sm btn-outline-primary"
                           th:href="@{/employees/{id}/edit(id=${employee.id})}">Edit</a>
                        <form class="d-inline" th:action="@{/employees/{id}/delete(id=${employee.id})}" method="post">
                            <button type="submit" class="btn btn-sm btn-outline-danger">Delete</button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </section>
</main>
</body>
</html>
